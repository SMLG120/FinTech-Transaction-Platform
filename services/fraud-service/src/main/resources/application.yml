# fraud-service
# Every value that differs between environments is supplied by the environment, never by a
# checked-in file. No secret has a default here on purpose: a missing variable must fail
# loudly at startup rather than silently connecting with a known password.
spring:
  application:
    name: fraud-service
  datasource:
    url: ${SERVICE_DB_URL:jdbc:postgresql://localhost:5432/fintech_fraud}
    username: ${SERVICE_DB_USERNAME:fintech_fraud}
    password: ${SERVICE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: fraud-service-cp
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 300000
      max-lifetime: 1200000
      data-source-properties:
        # Identifies the service in pg_stat_activity, which is the only practical way
        # to attribute a slow query to a service once several share one cluster.
        ApplicationName: ${spring.application.name}
        tcpKeepAlive: true
        # Bounds a hung query so it cannot pin a pool connection forever. Without this
        # a single blocked statement can exhaust the pool and fail every request.
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Off, deliberately, and this is not a default worth copying from a tutorial.
    #
    # baseline-on-migrate tells Flyway to mark a non-empty schema as up to date instead of migrating
    # it. It is for adopting a database that already has a schema this repository does not know
    # about. Every database here is created empty by the Postgres init script, so there is nothing
    # to adopt, and with Flyway's default baseline version of 1 the feature does real damage: it
    # records a baseline at version 1, which marks V1 as already applied, so the first migration
    # never runs. The service then fails Hibernate's schema validation on a table that was never
    # created, which reads like a broken migration rather than a setting that suppressed it.
    baseline-on-migrate: false
    validate-on-migrate: true
    # Migrations are reviewed code, never applied by the application at runtime in prod.
    # Local Docker Compose only; Phase 15 sets FLYWAY_ENABLED=false in the deployed chart.
    # Low default on purpose. Compose gates startup on the postgres healthcheck, so a retry is
    # only insurance; a high value turns a bad connection string into a multi-minute hang that
    # reads like a slow start rather than a misconfiguration.
    connect-retries: ${FLYWAY_CONNECT_RETRIES:3}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      properties:
        # Required for exactly-once *processing* support: makes a retried send a new
        # logical send rather than a second record appearing on the topic.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # String, not JsonSerializer. Every producer on this platform writes the envelope as text, and a
      # JsonSerializer would re-encode it through a type header that the consumer then has to be told
      # about. A fraud decision published as JSON through two serialisers is JSON that has been
      # serialised twice, and the bytes in the topic are then not the bytes the producing transaction
      # wrote to its outbox. The outbox pattern's promise is that the stored payload is the sent payload.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # String for the same reason as the producer. The listener receives the envelope as text and
      # deserializes it with the injected ObjectMapper, so the object mapper's configuration — modules,
      # date format, unknown-property handling — is the service's, and is the same one the tests use.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      # The container acknowledges offsets only after the handler returns, so a crash
      # mid-handling replays the record instead of losing it.
      ack-mode: record
      # One, deliberately, where the other services use three. Scoring is not embarrassingly parallel:
      # a payment's features are read from a shared observation table and a shared Redis counter, and
      # three consumer threads scoring the same customer's payments at once would make three of them
      # see a device or a velocity count that the others had already changed. Concurrency here is a
      # correctness parameter, not a throughput one, and it is the first thing to revisit if scoring
      # latency becomes a problem — with sharding by customer digest, not by raising the number.
      concurrency: ${KAFKA_CONCURRENCY:1}
      missing-topics-fatal: false
      # NOTE: the retry and dead-letter policy is NOT here.
      #
      # It used to be, under `max-attempts`, `back-off` and `dead-letter`, and it did nothing:
      # Spring Boot's KafkaProperties.Listener has none of those properties, and a
      # @ConfigurationProperties class silently ignores keys it does not know. No error-handler bean
      # existed either, so the container ran on Spring Kafka's built-in default — retry nine times
      # with no back-off, log, commit the offset, drop the event. A payment event that could not be
      # parsed was never parked on dead-letter-events; it was lost with a log line, while the topic
      # catalogue provisioned the topic and the docs described its contents.
      #
      # It lives under `app.fraud.dead-letter` now and is applied by KafkaErrorHandlingConfiguration.
      # FraudDeadLetterIntegrationTest runs a real broker and fails without it.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  error:
    # Never render a stack trace into a response body; the correlation id is the contract.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
  servlet:
    session:
      # The platform is a pure token-authenticated API: no server-side session state.
      persistent: false

management:
  endpoints:
    web:
      exposure:
        # Health and Prometheus are the only endpoints reachable without a token, and
        # they are network-restricted in addition (see infrastructure/kubernetes).
        # env, configprops, heapdump and loggers expose secrets or internals and stay closed.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      access: read_only
  metrics:
    tags:
      # environment and version are added automatically by ObservabilityAutoConfiguration.
      application: ${spring.application.name}
    distribution:
      # Bucket boundaries chosen around the latency budget of a payment authorisation.
      # Buckets that do not straddle the p95 hide exactly the regressions worth alerting on.
      percentiles-histogram.http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  tracing:
    enabled: false

logging:
  level:
    root: INFO
    com.fintech.platform: ${LOG_LEVEL_PLATFORM:INFO}
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:WARN}
    org.apache.kafka: ${LOG_LEVEL_KAFKA_CLIENT:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  structured:
    # ECS JSON so log aggregation can index fields instead of grepping strings.
    format:
      console: ${LOG_FORMAT:ecs}

app:
  environment: ${APP_ENVIRONMENT:local}
  version: ${APP_VERSION:0.1.0-SNAPSHOT}

  # ---------------------------------------------------------------------------------------
  # Phase 6: fraud scoring
  # ---------------------------------------------------------------------------------------
  # The retention and deduplication-pruning jobs, gated separately from the relay below so a
  # deployment running the relay as its own process can keep housekeeping here. Note that one
  # @EnableScheduling drives both, so relay-enabled=false stops these too; see
  # FraudSchedulingConfiguration for why there are two properties rather than one.
  background-jobs-enabled: ${FRAUD_BACKGROUND_JOBS_ENABLED:true}

  fraud:
    # The consumer group. One group, so one instance of this service scores a payment once; a second
    # instance joining the same group takes a share of the partitions, which is how the service scales.
    # Read by the @KafkaListener placeholders on FraudConsumer, hence the nesting under fraud rather than
    # app: a listener that reads app.consumer-group while the config says app.fraud.consumer-group works
    # only because the placeholder's default happens to match, and would silently ignore the setting.
    consumer-group: ${FRAUD_CONSUMER_GROUP:fraud-service}

    # The currency a single-scalar threshold is reported in, and the one every amount rule must
    # configure. See AmountThresholds for why an amount threshold is a map and not a number.
    default-currency: GBP

    decisions:
      # Where a score stops being a measurement and becomes an action. These are the documented
      # bands: LOW is 0-25, MEDIUM 26-50, HIGH 51-75, CRITICAL 76-100.
      review-threshold: 51
      decline-threshold: 76
      # Whether a human is expected to look. Separate from the decision thresholds so that "tell
      # someone" and "refuse the payment" can be moved independently.
      alert-threshold: 51
      # A single rule worth this much escalates on its own, whatever the total. Without it the score
      # is the only thing that matters, and a reasons list can show an alarming finding on a row that
      # was approved for no visible reason.
      #
      # 30 puts R001, R002 (35) and R004 (30) above the line and R003, R005, R006, R007 below it.
      # R006 — a device shared with other customers — deliberately does NOT escalate alone, because a
      # device shared between members of one household is not a signal and would otherwise fill the
      # queue. Changing this number changes which rules those are; see DecisionPolicy.
      high-signal-points: 30

    rules:
      # One entry per currency, because 5000 minor units is 50 GBP, 5000 JPY, and undefined for a
      # currency with no minor unit. A rule with no entry for the payment's currency does not fire,
      # and the decision records that it was not assessed.
      # UNREACHABLE AS CONFIGURED, and worth deciding deliberately rather than by accident.
      #
      # The comparison is strictly greater than, and transaction-service refuses any single payment
      # above 5000.00, so no payment this platform accepts can cross this line. R001 is worth 35
      # points -- the joint-largest rule, and one of only three above the escalation line -- and as
      # configured it can never fire. It is not dead code: the rule works, the threshold is simply
      # above the platform's own ceiling.
      #
      # Left as-is rather than quietly lowered, because "how large is too large" is a policy choice
      # and not a mechanical fix. Lowering it to the transaction ceiling, or raising the ceiling, are
      # both defensible; what is not defensible is leaving a headline rule that reads as active and
      # never is. scripts/verify-fraud-lifecycle.sh notes the same thing where it picks a different
      # rule to trip.
      large-amount:
        by-currency:
          GBP: "5000.00"
          USD: "6000.00"
          EUR: "5500.00"
      new-device-amount:
        by-currency:
          GBP: "1000.00"
          USD: "1200.00"
          EUR: "1100.00"
      new-merchant-amount:
        by-currency:
          GBP: "500.00"
          USD: "600.00"
          EUR: "550.00"
      velocity-max-payments: 5
      velocity-window-seconds: 60
      network-change-window-seconds: 600
      card-activation-window-seconds: 86400
      shared-device-min-other-customers: 1

    velocity:
      # The same number as the rule's window, so the counter's contents and the rule's comparison
      # cannot drift apart. The rule reads the sample's window rather than its own configured one
      # precisely so there is only one of these.
      window-seconds: 60

    observations:
      enabled: true
      device-retention-days: 180
      network-retention-days: 30
      merchant-retention-days: 365
      card-retention-days: 1095

    # When the retention jobs run. Off the hour and off the half hour, because every other service in the
    # platform is on the hour and a fleet of containers waking simultaneously to run table cleanup is a
    # cheap way to make a database look like it is under load. Both delete in bounded batches, so a late
    # or missed run costs disk and nothing else.
    retention-observation-cron: "0 17 4 * * *"
    # Twenty-six minutes after the observation prune, so the two DELETEs never contend with each other.
    retention-processed-cron: "0 43 4 * * *"

    alerts:
      breach-hours: 4
      # An analyst may adjust a score up to here. Above it, a decision would need a second approver,
      # which this deployment does not have — so it is refused with an explanation rather than
      # allowed. See DecisionService.ManualScoreAboveCapException.
      max-manual-score: 75

    # What happens to an event this consumer cannot read: retried a bounded number of times, then
    # republished on the dead-letter topic with the reason attached, so a poison payment event parks
    # where somebody can find it instead of blocking every payment behind it on the same partition.
    # Applied by KafkaErrorHandlingConfiguration; see the note under spring.kafka.listener for why
    # this is not configured there.
    dead-letter:
      topic: dead-letter-events
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000

  outbox:
    # Read by the @Scheduled placeholder on OutboxRelay, which is the only thing that consults it.
    poll-interval-millis: 500
    # Gates the scheduler for the relay AND the retention jobs. False in every @SpringBootTest, and
    # false in a deployment that runs the relay as a separate process. Named the same as
    # transaction-service's switch on purpose, so one setting covers the platform.
    relay-enabled: ${FRAUD_OUTBOX_RELAY_ENABLED:true}

# -------------------------------------------------------------------------------------------
# Phase 2: verify the identity the gateway asserted
# -------------------------------------------------------------------------------------------
# Spring's relaxed binding would read the environment variable as internal.identity.signing.key, not
# as this property, so the mapping is written out. No default: a service that starts without the key
# must fail to register the verification filter loudly rather than run while trusting unsigned headers.
platform:
  security:
    internal-identity:
      signing-key: ${INTERNAL_IDENTITY_SIGNING_KEY:}
      # How long a signed identity is honoured after the gateway issued it. Bounds the window in which
      # a role revoked a moment ago is still accepted; it does not eliminate replay.
      max-age-seconds: ${INTERNAL_IDENTITY_MAX_AGE_SECONDS:60}
    # The key THIS service uses to digest the subjects it records — the customers on decisions and the
    # analysts on timelines and audit events. Distinct from transaction-service's key even though both
    # were derived from the same Keycloak subject, and that is the platform rule rather than a
    # preference: a subject in this database must be unjoinable to a subject in any other, and a row
    # here is found by payment id rather than by matching digests.
    #
    # A payment's own identifiers are NOT digested with this key. Card, device and network references
    # arrive already digested from transaction-service, and this service deliberately holds no key that
    # could reproduce or verify them — it correlates on them and cannot interpret them.
    #
    # No default, so a service that starts without the key fails rather than running on one that is in
    # a sample file and therefore not secret. base64: `openssl rand -base64 32`.
    subject-digest:
      key: ${SUBJECT_DIGEST_KEY:}
