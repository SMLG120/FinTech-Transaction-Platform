# Public deployment overlay, shared by every deploy target. Use it with the root file and one
# target's edge overlay, e.g.:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.public.yml \
#                  -f deploy/oracle/docker-compose.caddy.yml up -d --build
#
# deploy/oracle/deploy.sh and deploy/codespaces/start.sh do this for you. They write the four
# PUBLIC_*_URL values to .env and render deploy/generated/ from them with deploy/render.py.

services:
  dashboard:
    image: fintech/dashboard:public
    build:
      context: .
      dockerfile: frontend/fintech-dashboard/Dockerfile
      args:
        # Vite bakes these into the bundle at build time; the image is per-deployment.
        VITE_GATEWAY_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is not set}
        VITE_KEYCLOAK_URL: ${PUBLIC_AUTH_URL:?PUBLIC_AUTH_URL is not set}
    container_name: fintech-dashboard
    restart: unless-stopped
    networks: [fintech]
    volumes:
      - ./deploy/generated/dashboard-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/index.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web-frontend:
    volumes:
      - ./deploy/generated/web-config.json:/usr/share/nginx/html/config.json:ro
      - ./deploy/generated/web-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro

  keycloak:
    environment:
      # The issuer every token carries, and the only hostname browsers use.
      KC_HOSTNAME: ${PUBLIC_AUTH_URL:?PUBLIC_AUTH_URL is not set}
      KC_PROXY_HEADERS: xforwarded
      # auth-service calls the admin API at http://keycloak:8180 on the private network.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      # Same target as the base file, so this replaces the local-dev realm with the rendered one.
      - ./deploy/generated/realm:/opt/keycloak/data/import:ro

  api-gateway:
    environment:
      KEYCLOAK_ISSUER: ${PUBLIC_AUTH_URL:?PUBLIC_AUTH_URL is not set}/realms/fintech
      GATEWAY_CORS_ALLOWED_ORIGINS: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is not set},${PUBLIC_DASH_URL:?PUBLIC_DASH_URL is not set}
      # Safe only because Caddy, the sole ingress, overwrites X-Forwarded-For (deploy/edge.caddy).
      SERVER_FORWARD_HEADERS_STRATEGY: framework
