{{- /*
One ServiceAccount per service. Today they carry no RBAC bindings — the pods
make no Kubernetes API calls — and that is intentional: their purpose is
identity, not authorisation. When mTLS lands (ADR-0016), each service
presents the certificate bound to its own account's SPIFFE URI, so a
compromised service holds credentials for itself and nothing else. Creating
the accounts now means the identity exists before anything depends on it.
*/ -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    app.kubernetes.io/part-of: secure-fintech-platform
automountServiceAccountToken: false
{{- end }}
