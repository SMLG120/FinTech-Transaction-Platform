{{- /*
Secrets, per service plus one shared. Keys are environment variable names, so
the Secret is reviewable against the container env without a mapping table.
Every value is required: rendering with an empty secret fails loudly naming
the missing value — the Helm equivalent of the Compose `${VAR:?...}` rule,
because a service that starts with an empty password is worse than one that
refuses to render.
*/ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-shared
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/part-of: secure-fintech-platform
type: Opaque
stringData:
  # The interim shared HMAC key (ADR-0004): gateway plus all services, until
  # per-service certificates replace it (ADR-0016).
  INTERNAL_IDENTITY_SIGNING_KEY: {{ required "global.identitySigningKey is required: pass it with -f, never commit it" .Values.global.identitySigningKey | quote }}
  REDIS_PASSWORD: {{ required "global.redisPassword is required: pass it with -f, never commit it" .Values.global.redisPassword | quote }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    app.kubernetes.io/part-of: secure-fintech-platform
type: Opaque
stringData:
  {{- range $var, $value := $svc.secrets }}
  {{ $var }}: {{ required (printf "%s.%s is required: pass it with -f, never commit it" $name $var) $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
