      <<: *service-env
      SERVER_PORT: "8088"
      SERVICE_DB_URL: jdbc:postgresql://postgres:5432/fintech_disputes
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?run ./scripts/bootstrap.sh to create .env}
      SERVICE_DB_USERNAME: fintech_disputes
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:9088:8088"
    depends_on:
