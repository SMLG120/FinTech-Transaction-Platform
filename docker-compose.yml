      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?run ./scripts/bootstrap.sh to create .env}
      SERVICE_DB_USERNAME: fintech_audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:9087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  dispute-service:
    <<: *service
    image: fintech/dispute-service:local
