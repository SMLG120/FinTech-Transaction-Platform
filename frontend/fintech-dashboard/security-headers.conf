# Included at server level AND in every location that sets its own add_header (nginx drops
# inherited add_header directives in such blocks). connect-src lists the gateway and Keycloak;
# deploy/render.py swaps the localhost pair for the public origins.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Scripts are strictly same-origin. style-src allows inline styles because React/framer-motion
# set style attributes; no script can be injected through a style attribute.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8180; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
