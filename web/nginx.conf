# Static file serving for the customer web UI. No proxying, no templating: the browser talks
# to the gateway and Keycloak directly, so there is no backend here to misconfigure and no secret
# to leak through it. The only dynamic behaviour is config.json, which carries public endpoint
# addresses (never secrets) and is served with the rest.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Clickjacking: a banking UI must never render inside another site's frame.
    add_header X-Frame-Options "DENY" always;
    # MIME sniffing off: styles and scripts are served with their types, full stop.
    add_header X-Content-Type-Options "nosniff" always;
    # No referrer leakage to the identity provider or the API hosts.
    add_header Referrer-Policy "no-referrer" always;

    # config.json changes per environment, so it must never sit in a cache from a previous one.
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
