# Static file serving for the customer web UI. No proxying, no templating: the browser talks
# to the gateway and Keycloak directly, so there is no backend here to misconfigure and no secret
# to leak through it. The only dynamic behaviour is config.json, which carries public endpoint
# addresses (never secrets) and is served with the rest.
server {
    # 8080, not 80: the image runs as an unprivileged user, which cannot bind ports below 1024.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in headers or error pages.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # config.json changes per environment, so it must never sit in a cache from a previous one.
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
