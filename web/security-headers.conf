# Included at server level AND inside every location that sets its own add_header: nginx drops
# inherited add_header directives in any block that declares one, which would silently strip these.

# Clickjacking: a banking UI must never render inside another site's frame.
add_header X-Frame-Options "DENY" always;
# MIME sniffing off: styles and scripts are served with their types, full stop.
add_header X-Content-Type-Options "nosniff" always;
# No referrer leakage to the identity provider or the API hosts.
add_header Referrer-Policy "no-referrer" always;
# The UI runs only its own scripts and talks only to the gateway and Keycloak. An injected
# <script> or a fetch to an attacker's host is refused by the browser even if markup slips through.
# Replace the two localhost origins with the real gateway/IdP origins per environment.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8180; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only meaningful over HTTPS (browsers ignore it on http://localhost); takes effect once TLS terminates here.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
